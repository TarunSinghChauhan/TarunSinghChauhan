name: Bat Contribution Matrix

on:
  schedule:
    - cron: '0 4 * * *'    # runs daily at 4 AM UTC
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate bat matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: TarunSinghChauhan
        run: python scripts/generate_bat_matrix.py

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add bat-matrix.svg
          if git commit -m "update bat contribution matrix"; then
            git push
          fi
